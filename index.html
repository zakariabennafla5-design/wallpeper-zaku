<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع zaku خلفيات الكمبيوتر</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(15, 23, 42, 0.9);
            --accent: #38bdf8;
            --text: #e2e8f0;
            --muted: #94a3b8;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(56,189,248,0.2), transparent 25%),
                        linear-gradient(180deg, #0f172a 0%, #020617 100%);
        }
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 3vw, 3rem);
        }
        p {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
        }
        .panel {
            background: var(--panel);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 24px;
            padding: 22px;
            backdrop-filter: blur(22px);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
        }
        .auth-section {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-section button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin: 8px;
        }
        .auth-section button:hover {
            background: #3367d6;
        }
        .auth-form {
            display: none;
            margin-top: 16px;
        }
        .auth-form input {
            padding: 10px;
            margin: 8px;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.85);
            color: var(--text);
        }
        .auth-form button {
            background: #10b981;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
        }
        .auth-form button:hover {
            background: #059669;
        }
        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        .upload-area {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr auto;
            align-items: center;
            margin-bottom: 22px;
        }
        .upload-area input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.85);
            color: var(--text);
            cursor: pointer;
        }
        .upload-area label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 16px;
            background: #0ea5e9;
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .upload-area label:hover {
            transform: translateY(-2px);
        }
        .options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            align-items: center;
        }
        .options select,
        .options button {
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.85);
            color: var(--text);
            font-size: 0.95rem;
        }
        .options button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
        .drop-zone {
            border: 2px dashed rgba(148, 163, 184, 0.4);
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            color: var(--muted);
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .drop-zone.dragover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-top: 18px;
        }
        .card {
            overflow: hidden;
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.15);
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }
        .card img {
            width: 100%;
            aspect-ratio: 16 / 10;
            object-fit: cover;
        }
        .card-body {
            padding: 16px;
            display: grid;
            gap: 10px;
            flex: 1;
        }
        .card-body .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            border: none;
            border-radius: 14px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        button:hover {
            transform: translateY(-1px);
        }
        .btn-set {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #fff;
            flex: 1;
        }
        .btn-download {
            background: #10b981;
            color: #fff;
            flex: 1;
        }
        .btn-remove {
            background: rgba(255,255,255,0.08);
            color: #cbd5e1;
            flex: 1;
        }
        .status {
            color: #a5f3fc;
            min-height: 1.5rem;
        }
        @media (max-width: 740px) {
            .upload-area,
            .options {
                grid-template-columns: 1fr;
                display: grid;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>مكتبة خلفيات الكمبيوتر</h1>
            <p>حمّل صورك ثم اختر من بينها لتعرض كخلفية على الصفحة أو نزّلها على جهازك.</p>
        </header>

        <section class="panel auth-section" id="authSection">
            <p>يمكنك رفع الصور مباشرة دون تسجيل دخول.</p>
        </section>

        <section class="panel" id="uploadPanel">
            <div class="upload-area">
                <input id="fileInput" type="file" accept="image/*" multiple>
                <label for="fileInput">اختر صورًا</label>
            </div>
            <div class="options">
                <label>
                    جودة التحميل:
                    <select id="qualitySelect">
                        <option value="1">عالية جداً (100%)</option>
                        <option value="0.8">جودة ممتازة (80%)</option>
                        <option value="0.6">متوسطة (60%)</option>
                        <option value="0.4">خفيفة (40%)</option>
                    </select>
                </label>
                <button id="clearLibrary">مسح المكتبة</button>
            </div>
            <div id="dropZone" class="drop-zone">
                اسحب الخلفيات وأفلتها هنا أو اضغط على الزر لاختيار الصور
            </div>
            <div class="status" id="statusMessage"></div>
        </section>

        <section class="panel" id="galleryPanel">
            <h2>معرض الخلفيات</h2>
            <div class="gallery" id="gallery"></div>
        </section>
    </main>
    <script>
        const uploadPanel = document.getElementById('uploadPanel');
        const galleryPanel = document.getElementById('galleryPanel');
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const gallery = document.getElementById('gallery');
        const statusMessage = document.getElementById('statusMessage');
        const qualitySelect = document.getElementById('qualitySelect');
        const clearLibraryBtn = document.getElementById('clearLibrary');

        let images = [];

        function setStatus(message, isError = false) {
            statusMessage.textContent = message;
            statusMessage.style.color = isError ? '#fb7185' : '#a5f3fc';
        }

        function saveImages() {
            localStorage.setItem('wallpapers', JSON.stringify(images));
        }

        function loadSavedImages() {
            const stored = localStorage.getItem('wallpapers');
            images = stored ? JSON.parse(stored) : [];
            updateGallery();
        }

        function blobToDataURL(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        loadSavedImages();

        function fileToBlob(file, quality) {
            return new Promise((resolve, reject) => {
                if (quality >= 1) {
                    return resolve(file);
                }

                const image = new Image();
                const reader = new FileReader();

                reader.onload = () => {
                    image.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ratio = Math.min(1920 / image.width, 1080 / image.height, 1);
                        canvas.width = image.width * ratio;
                        canvas.height = image.height * ratio;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob(blob => {
                            if (blob) resolve(blob);
                            else reject(new Error('فشل ضغط الصورة'));
                        }, 'image/jpeg', quality);
                    };
                    image.onerror = reject;
                    image.src = reader.result;
                };

                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function addImages(files) {
            const imageFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
            if (!imageFiles.length) {
                setStatus('الملفات المضافة ليست صوراً. اختر صوراً فقط.', true);
                return;
            }

            const quality = Number(qualitySelect.value);
            let addedCount = 0;

            for (const file of imageFiles) {
                try {
                    const blob = await fileToBlob(file, quality);
                    const url = await blobToDataURL(blob);
                    images.push({ name: file.name, url });
                    addedCount += 1;
                } catch (error) {
                    console.error('خطأ في معالجة الصورة:', error);
                }
            }

            saveImages();
            updateGallery();
            setStatus(`${addedCount} صورة تمّت إضافتها إلى المكتبة.`);
        }

        function loadSavedImages() {
            const stored = localStorage.getItem('wallpapers');
            images = stored ? JSON.parse(stored) : [];
            updateGallery();
        }

        function updateGallery() {
            gallery.innerHTML = '';
            if (!images.length) {
                gallery.innerHTML = '<p style="color: var(--muted);">لا توجد خلفيات بعد. أضف صوراً لبدء المعرض.</p>';
                return;
            }

            images.forEach((item, index) => {
                const card = document.createElement('article');
                card.className = 'card';

                const img = document.createElement('img');
                img.src = item.url;
                img.alt = item.name;

                const body = document.createElement('div');
                body.className = 'card-body';

                const name = document.createElement('div');
                name.textContent = item.name;
                name.style.fontWeight = '600';
                name.style.color = '#e2e8f0';

                const buttons = document.createElement('div');
                buttons.className = 'buttons';

                const setBtn = document.createElement('button');
                setBtn.className = 'btn-set';
                setBtn.textContent = 'اجعلها خلفية';
                setBtn.addEventListener('click', () => setWallpaper(item.url, item.name));

                const downloadBtn = document.createElement('button');
                downloadBtn.className = 'btn-download';
                downloadBtn.textContent = 'تحميل';
                downloadBtn.addEventListener('click', () => downloadImage(item));

                const removeBtn = document.createElement('button');
                removeBtn.className = 'btn-remove';
                removeBtn.textContent = 'حذف';
                removeBtn.addEventListener('click', async () => {
                    await removeImage(item.ref, index);
                });

                buttons.appendChild(setBtn);
                buttons.appendChild(downloadBtn);
                buttons.appendChild(removeBtn);
                body.appendChild(name);
                body.appendChild(buttons);
                card.appendChild(img);
                card.appendChild(body);
                gallery.appendChild(card);
            });
        }

        function setWallpaper(imageUrl, name) {
            document.body.style.backgroundImage = `url('${imageUrl}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundRepeat = 'no-repeat';
            setStatus(`تم عرض الخلفية: ${name}`);
        }

        function downloadImage(item) {
            const link = document.createElement('a');
            link.href = item.url;
            link.download = item.name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function removeImage(refPath, index) {
            images.splice(index, 1);
            saveImages();
            updateGallery();
            setStatus('تم حذف الخلفية.');
        }

        fileInput.addEventListener('change', event => {
            addImages(event.target.files);
            fileInput.value = '';
        });

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, event => event.preventDefault());
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'));
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'));
        });

        dropZone.addEventListener('drop', event => {
            if (event.dataTransfer.files.length) {
                addImages(event.dataTransfer.files);
            }
        });

        clearLibraryBtn.addEventListener('click', () => {
            if (!confirm('هل تريد مسح كل الصور من المكتبة؟')) return;
            images = [];
            saveImages();
            updateGallery();
            setStatus('تم مسح المكتبة بالكامل.');
        });
    </script>
</body>
</html>
